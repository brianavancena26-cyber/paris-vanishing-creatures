></figure><div class="paper"><p>'+q[2]+'</p><hr><h2 style="font-size:23px">'+q[3]+'</h2></div>';h+=q[4]?q[4].map((v,i)=>'<button class="opt '+(choice===i?'chosen':'')+'" data-choice="'+i+'">✧ '+esc(v)+'</button>').join(''):'<input id="answer" class="input" placeholder="Write your answer" value="'+esc(typed)+'">';if(s.hints.includes(s.step))h+='<div class="paper">Professor Aldric’s hint: '+q[6]+'</div>';h+=btn('Cast answer spell ✦','answer');if(!s.hints.includes(s.step))h+=btn('Ask for a hint (−2 points)','hint',true);}}if(message)h+='<div class="msg">'+esc(message)+'</div>';app.innerHTML=h;if(screen==='game'&&tab==='challenge')loadLandmarkPhoto(s.step);}
app.addEventListener('input',e=>{if(e.target.id==='answer')typed=e.target.value});app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.choice!==undefined){choice=Number(b.dataset.choice);message='';render();return}if(b.dataset.tab){tab=b.dataset.tab;message='';render();return}if(b.dataset.tile!==undefined){const i=Number(b.dataset.tile);if(selected===-1)selected=i;else if(selected===i)selected=-1;else{[s.tiles[i],s.tiles[selected]]=[s.tiles[selected],s.tiles[i]];selected=-1;save()}render();return}const a=b.dataset.act;if(a==='story')story=(story+1)%4;else if(a==='begin'){const name=document.getElementById('name').value.trim();const tour=document.getElementById('tour').value.trim().toUpperCase();if(!name||!/^[A-Z0-9_-]{3,32}$/.test(tour)){message='Enter your wizard name and a valid scheduled-tour code (3–32 letters or numbers).';render();return}try{await register(name,tour)}catch(e){message='Could not join this tour: '+e.message;render();return}s.name=name;const arr=[0,1,2,3,4,5,6,7];for(let i=7;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}s.order=arr;screen='game';save()}else if(a==='answer'){let ans=Q[s.step][4]?choice:document.getElementById('answer').value.trim().toLowerCase();const expected=Q[s.step][5];if(ans===expected||(s.step===7&&ans==='a unicorn')){s.score+=10;s.solved.push(s.step);s.awards[s.step]=s.order[s.step];screen='reward';choice=-1;typed='';message='';save();syncProgress()}else{if(ans===-1||ans===''){message='Please choose or enter an answer.'}else{s.score=Math.max(0,s.score-1);message='Not quite! The seal remains locked. Try again.'}save()}}else if(a==='hint'){s.score=Math.max(0,s.score-2);s.hints.push(s.step);save()}else if(a==='next'){s.step++;choice=-1;typed='';tab='challenge';message='';if(s.step===8){s.tiles=[...s.order];screen='puzzle'}else screen='game';save()}else if(a==='cast'){if(s.tiles.every((v,i)=>words[v]===words[i])){s.finished=true;screen='win';message='';save();syncProgress()}else message='The spell is still scrambled. Rearrange the words and try again.'}else if(a==='refresh'){refreshLeaders()}else if(a==='restart'){s=fresh();session=null;localStorage.removeItem('vanishing-session-v1');screen='welcome';story=0;message='';save()}render()});if(s.name&&!session)screen='welcome';if(s.finished&&session)screen='win';else if(s.step===8)screen='puzzle';else if(s.solved.includes(s.step))screen='reward';render();if(session)refreshLeaders();
</script></body></html>
