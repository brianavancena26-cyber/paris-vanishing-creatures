ers();stopNarration();const name=document.getElementById('name').value.trim();const tour=document.getElementById('tour').value.trim().toUpperCase();if(!name||!/^[A-Z0-9_-]{3,32}$/.test(tour)){message='Enter your wizard name and a valid scheduled-tour code (3–32 letters or numbers).';render();return}try{await register(name,tour)}catch(e){message='Could not join this tour: '+e.message;render();return}s=fresh();s.name=name;const arr=[0,1,2,3,4,5,6,7];for(let i=7;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}s.order=arr;screen='game';save()}else if(a==='answer'){let ans=Q[s.step][4]?choice:document.getElementById('answer').value.trim().toLowerCase();const expected=Q[s.step][5];if(ans===expected||(s.step===7&&ans==='a unicorn')){s.score+=10;s.solved.push(s.step);s.awards[s.step]=s.order[s.step];screen='reward';choice=-1;typed='';message='';save();syncProgress()}else{if(ans===-1||ans===''){message='Please choose or enter an answer.'}else{s.score=Math.max(0,s.score-1);message='Not quite! The seal remains locked. Try again.'}save()}}else if(a==='hint'){s.score=Math.max(0,s.score-2);s.hints.push(s.step);save()}else if(a==='next'){s.step++;choice=-1;typed='';tab='challenge';message='';if(s.step===8){s.tiles=[...s.order];screen='puzzle'}else screen='game';save()}else if(a==='cast'){if(s.tiles.every((v,i)=>words[v]===words[i])){s.finished=true;screen='win';message='';save();syncProgress()}else message='The spell is still scrambled. Rearrange the words and try again.'}else if(a==='refresh'){refreshLeaders()}else if(a==='restart'){s=fresh();session=null;localStorage.removeItem('vanishing-session-v1');screen='welcome';story=0;message='';save();startStory()}render()});screen='welcome';startStory();
