<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171324"><title>The Vanishing Creatures | Paris Wizarding Quest</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#4b273d,#16172a 65%);color:#f3e4c5;font:17px/1.5 Georgia,serif}main{max-width:570px;margin:auto;min-height:100vh;padding:22px 17px 50px}.brand{font:11px system-ui;letter-spacing:3px;color:#e1be7b;text-align:center;text-shadow:0 0 15px #e8b76b66;border-bottom:1px solid #a68b69;padding:10px 0 20px}h1,h2{font-weight:normal;color:#f4dba5;line-height:1.15}h1{font-size:clamp(36px,9vw,55px)}h2{font-size:31px}.center{text-align:center}.small{font:12px system-ui;letter-spacing:2px;color:#dfba77}.portrait{height:310px;border:1px solid #b89763;border-radius:140px 140px 14px 14px;display:grid;place-items:center;background:radial-gradient(circle,#9c6949,#2e2540 68%);font-size:100px;margin:20px 0;background-image:linear-gradient(0deg,#19152566,#19152500 40%),url("./professor-aldric.svg");background-size:cover;background-position:center;box-shadow:0 0 0 5px #a88b4b22,0 20px 70px #0007}.paper{background:linear-gradient(140deg,#f8e9c8,#ddc69d);color:#493021;border:1px solid #b69a6b;box-shadow:inset 0 0 0 5px #e8d3aa,0 15px 25px #0004;border-radius:9px;padding:22px;margin:18px 0;position:relative}.paper:before{content:"✦";position:absolute;right:15px;top:10px;color:#9e7648;opacity:.5;font-size:22px}.paper h2{color:#593923}.btn,.opt,.tile{cursor:pointer;font:inherit;border-radius:7px;min-height:54px;transition:transform .15s,box-shadow .15s}.btn:active,.opt:active,.tile:active{transform:scale(.98)}.btn{width:100%;background:linear-gradient(110deg,#b18a51,#eed29b,#b18a51);border:1px solid #f5daaa;color:#392619;padding:13px;margin:10px 0;box-shadow:0 4px 0 #4c2e23,0 0 25px #e8b56c18}.alt{background:#382c42;color:#f5dfba;border-color:#8e7656}.opt{width:100%;text-align:left;padding:15px;background:#332b42;border:1px solid #74607a;color:#f2e4c8;margin:7px 0}.opt.chosen{background:#694e45;border-color:#edcb83}.input{width:100%;padding:13px;background:#f6e6c6;color:#352318;border:1px solid #b39b70;border-radius:6px;font:19px Georgia,serif}.tabs{display:flex;gap:5px;margin:16px 0}.tabs button{flex:1;padding:12px 3px;background:#3a3047;color:#f4e0bd;border:1px solid #7d6675;border-radius:5px}.tabs button.active{background:#8b6745}.progress{display:flex;gap:5px;margin:14px 0}.progress i{height:6px;background:#56465c;flex:1;border-radius:8px}.progress i.on{background:#edc681}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{background:#f0debb;color:#493020;border:1px solid #b59667;padding:12px 4px}.tile.selected{background:#b88b4c;outline:3px solid #f5d9a2}.entry{border-bottom:1px solid #b69d74;padding:12px 0}.msg{padding:12px;background:#523c3b;border-radius:5px;margin:12px 0}.success{background:#335343}.foot{text-align:center;color:#a89db2;font:11px system-ui;margin-top:35px}button:focus-visible,input:focus-visible{outline:3px solid #f9e2a9;outline-offset:3px}
</style></head><body><main><div class="brand">✧ THE WIZARDING ARCHIVES ✧</div><div id="app"></div><div class="foot">An original Paris adventure · Fictional reward is not a museum admission ticket</div></main><script>
const Q=[
['Passage de l’Ancre','The Missing Owl','A messenger owl has vanished in a hidden Paris passage.','Which hidden wizarding shopping street does Harry visit with Hagrid?',['Hogsmeade','Diagon Alley','Knockturn Alley'],1,'Hagrid takes Harry shopping there.','The owl carried a warning about a dangerous collector.'],
['Nicolas Flamel’s House','The Alchemist’s Code','An old notebook hides a concealment spell.','What four-digit year appears on the historic house?',null,'1407','Look at the date carved on the house.','The concealment spell may explain the disappearances.'],
['Stravinsky Fountain','The Dragon’s Reflection','A dragon appears in the water’s reflection, then vanishes.','What do some sculptures at the fountain do?',['Move','Disappear','Turn into stone'],0,'Watch the sculptures.','The dragon vanished without a struggle.'],
['Saint-Merri Church','The Stone Guardians','Stone guardians protect the next seal.','Which is a real Gothic gargoyle?',['A carved stone waterspout','A lion statue','A decorative dragon'],0,'A gargoyle is a stone waterspout.','The guardians were protecting a secret.'],
['Tour Saint-Jacques','The Vanishing Minute','All three creatures disappeared at the same moment.','Which magical object does Hermione use to travel back in time?',['Golden Snitch','Time-Turner','Remembrall'],1,'Think of a small hourglass.','The creatures vanished before the collector arrived.'],
['Hôtel de Ville','The French Witch’s Letter','An enchanted letter reveals a French witch discovered the collector’s plan.','Which French wizarding school visits Hogwarts during the Triwizard Tournament?',['Durmstrang','Beauxbatons','Ilvermorny'],1,'Its name begins with Beau.','A Beauxbatons witch acted to protect the creatures.'],
['Notre-Dame Cathedral','The Gothic Warning','The cathedral reveals another clue about the sanctuary.','Which architectural feature can you observe on Notre-Dame?',['Pointed Gothic arches','Glass skyscrapers','Ancient pyramids'],0,'Look at the arches.','A one-horned guardian protects the sanctuary.'],
['Musée de Cluny','The Final Guardian','The last seal lies near the medieval tapestries.','Which one-horned magical creature appears in the museum’s medieval tapestries?',null,'unicorn','It resembles a horse with a single horn.','The unicorn guards the sanctuary.']
];
const words=['THE','CREATURES','ARE','SAFE','BEHIND','THE',"UNICORN'S",'HIDDEN DOOR'];const key='vanishing-creatures-v1';const fresh=()=>({name:'',step:0,score:0,solved:[],hints:[],awards:[],order:[],tiles:[],finished:false});let s;try{s=JSON.parse(localStorage.getItem(key))||fresh()}catch{s=fresh()}let screen=s.name?'game':'welcome',tab='challenge',choice=-1,typed='',selected=-1,message='',story=0;const save=()=>localStorage.setItem(key,JSON.stringify(s));const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const app=document.getElementById('app');const btn=(label,act,alt=false)=>'<button class="btn '+(alt?'alt':'')+'" data-act="'+act+'">'+label+'</button>';const stories=['Welcome, young wizard. I am Professor Aldric, Keeper of the Magical Creatures Archive.','An owl, a dragon and a unicorn have vanished across Paris. An evil collector is searching for them.','A brave French witch has left eight enchanted seals. Each solved mystery awards a scrambled secret word.','Collect the eight words in your Journal, then restore the final spell to uncover the creatures’ sanctuary.'];
function render(){let h='';if(screen==='welcome'){h='<div class="center"><div class="small">A MAGICAL PARIS SCAVENGER HUNT</div><h1>The Vanishing Creatures</h1><p>Eight enchanted seals · One mystery</p></div><div class="portrait" role="img" aria-label="Professor Aldric, an elderly wizard in a candlelit Gothic library"></div><div class="paper"><div class="small">PROFESSOR ALDRIC · '+(story+1)+'/4</div><p>'+stories[story]+'</p></div>'+btn('Continue the story ✧','story',true)+'<p>Your wizard name</p><input id="name" class="input" maxlength="36" placeholder="Enter your wizard name">'+btn('Begin the quest ✦','begin');}
else if(screen==='reward'){const i=s.step;h='<div class="center"><div class="small">SEAL '+(i+1)+' UNLOCKED</div><h1>✦ A Word Recovered ✦</h1></div><div class="paper center"><p>Your scrambled secret word</p><h2>'+esc(words[s.awards[i]])+'</h2><p>'+Q[i][7]+'</p></div>'+btn(i===7?'Open the final enchantment ✦':'Continue to next location →','next');}
else if(screen==='puzzle'){h='<div class="center"><div class="small">THE FINAL ENCHANTMENT</div><h2>Restore the Lost Message</h2><p>Tap two words to swap them. Arrange all eight words into the final spell.</p></div><div class="paper"><div class="grid">'+s.tiles.map((id,i)=>'<button class="tile '+(selected===i?'selected':'')+'" data-tile="'+i+'">'+(i+1)+'. '+esc(words[id])+'</button>').join('')+'</div></div>'+btn('Cast the final spell ✦','cast');}
else if(screen==='win'){h='<div class="center"><div class="small">QUEST COMPLETE</div><h1>The Creatures Are Safe!</h1><p>Congratulations, '+esc(s.name)+'!</p></div><div class="paper center"><p>✦ 🦄 ✦</p><h2>Musée de Cluny</h2><p>Enchanted award for '+esc(s.name)+'</p><p>'+s.score+' points · Eight seals unlocked</p><p>DEMO ONLY — NOT VALID FOR ADMISSION</p></div><div class="paper"><p>Professor Aldric reveals that a brave Beauxbatons witch hid the creatures in a magical sanctuary to protect them from the collector.</p></div>'+btn('Play again ↻','restart');}
else{const q=Q[s.step];h='<div class="small">WIZARD '+esc(s.name)+' · '+s.score+' POINTS</div><div class="progress">'+Q.map((_,i)=>'<i class="'+(i<=s.step?'on':'')+'"></i>').join('')+'</div><div class="tabs">'+['challenge','journal','vault'].map(t=>'<button data-tab="'+t+'" class="'+(tab===t?'active':'')+'">'+t.toUpperCase()+'</button>').join('')+'</div>';if(tab==='journal'){h+='<div class="paper"><h2>Enchanted Journal</h2>'+Q.map((q,i)=>'<div class="entry">'+(i+1)+'. '+q[0]+'<p>'+(s.solved.includes(i)?'✦ '+esc(words[s.awards[i]])+' — '+q[7]:'🔒 Locked')+'</p></div>').join('')+'</div>';}else if(tab==='vault'){h+='<div class="paper"><h2>Wizard’s Vault</h2><p>'+s.solved.length+'/8 words collected. These words are scrambled.</p><div class="grid">'+s.solved.map(i=>'<div class="tile">'+esc(words[s.awards[i]])+'</div>').join('')+'</div></div>';}else{h+='<p class="small">✧ '+q[0]+' · SEAL '+(s.step+1)+'/8</p><h2>'+q[1]+'</h2><div class="paper"><p>'+q[2]+'</p><hr><h2 style="font-size:23px">'+q[3]+'</h2></div>';h+=q[4]?q[4].map((v,i)=>'<button class="opt '+(choice===i?'chosen':'')+'" data-choice="'+i+'">✧ '+esc(v)+'</button>').join(''):'<input id="answer" class="input" placeholder="Write your answer" value="'+esc(typed)+'">';if(s.hints.includes(s.step))h+='<div class="paper">Professor Aldric’s hint: '+q[6]+'</div>';h+=btn('Cast answer spell ✦','answer');if(!s.hints.includes(s.step))h+=btn('Ask for a hint (−2 points)','hint',true);}}if(message)h+='<div class="msg">'+esc(message)+'</div>';app.innerHTML=h;}
app.addEventListener('input',e=>{if(e.target.id==='answer')typed=e.target.value});app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.choice!==undefined){choice=Number(b.dataset.choice);message='';render();return}if(b.dataset.tab){tab=b.dataset.tab;message='';render();return}if(b.dataset.tile!==undefined){const i=Number(b.dataset.tile);if(selected===-1)selected=i;else if(selected===i)selected=-1;else{[s.tiles[i],s.tiles[selected]]=[s.tiles[selected],s.tiles[i]];selected=-1;save()}render();return}const a=b.dataset.act;if(a==='story')story=(story+1)%4;else if(a==='begin'){const name=document.getElementById('name').value.trim();if(!name){message='Please enter your wizard name.';render();return}s.name=name;const arr=[0,1,2,3,4,5,6,7];for(let i=7;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}s.order=arr;screen='game';save()}else if(a==='answer'){let ans=Q[s.step][4]?choice:document.getElementById('answer').value.trim().toLowerCase();const expected=Q[s.step][5];if(ans===expected||(s.step===7&&ans==='a unicorn')){s.score+=10;s.solved.push(s.step);s.awards[s.step]=s.order[s.step];screen='reward';choice=-1;typed='';message='';save()}else{if(ans===-1||ans===''){message='Please choose or enter an answer.'}else{s.score=Math.max(0,s.score-1);message='Not quite! The seal remains locked. Try again.'}save()}}else if(a==='hint'){s.score=Math.max(0,s.score-2);s.hints.push(s.step);save()}else if(a==='next'){s.step++;choice=-1;typed='';tab='challenge';message='';if(s.step===8){s.tiles=[...s.order];screen='puzzle'}else screen='game';save()}else if(a==='cast'){if(s.tiles.every((v,i)=>v===i)){s.finished=true;screen='win';message='';save()}else message='The spell is still scrambled. Rearrange the words and try again.'}else if(a==='restart'){s=fresh();screen='welcome';story=0;message='';save()}render()});if(s.finished)screen='win';else if(s.step===8)screen='puzzle';else if(s.solved.includes(s.step))screen='reward';render();
</script></body></html>
